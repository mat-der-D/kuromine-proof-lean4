name: Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and verify proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false

      - name: Build Lean project
        shell: bash
        run: |
          set +e
          lake exe cache get > lean-build.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            lake build >> lean-build.log 2>&1
            status=$?
          fi
          cat lean-build.log
          exit "$status"

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-log
          path: lean-build.log
