name: Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and verify proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Lean project with Mathlib cache
        id: lean
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false

      - name: Capture build diagnostics
        if: steps.lean.outcome == 'failure'
        run: lake build > lean-build.log 2>&1 || true

      - name: Upload build diagnostics
        if: steps.lean.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-log
          path: |
            lean-build.log
            KuromineProof/SmallCases.lean

      - name: Preserve Lean result
        if: steps.lean.outcome == 'failure'
        run: exit 1
