name: Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and verify proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Lean project with Mathlib cache
        id: lean
        continue-on-error: true
        uses: leanprover/lean-action@v1

      - name: Capture build log
        if: steps.lean.outcome == 'failure'
        run: lake build > lean-build.log 2>&1 || true

      - name: Upload build log
        if: steps.lean.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-log
          path: lean-build.log

      - name: Fail when Lean build failed
        if: steps.lean.outcome == 'failure'
        run: exit 1
